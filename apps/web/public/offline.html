<!doctype html>
<!--
  Ditampilkan service worker kalau halaman yang dibuka belum pernah tersimpan dan jaringan
  putus. Berdiri sendiri tanpa Nuxt, jadi warnanya ditulis langsung (sama dengan token
  --color-canvas dan --color-ink di main.css).
-->
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f4f8" />
    <meta name="robots" content="noindex" />
    <title>Offline · PostPocket</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f1f4f8;
        color: #18204a;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 22rem;
        padding: 2rem 1.5rem;
        text-align: center;
      }
      img {
        width: 48px;
        height: 48px;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.25rem;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.5;
        color: rgb(24 32 74 / 0.66);
      }
      .actions {
        margin-top: 1.5rem;
        display: flex;
        justify-content: center;
        gap: 0.5rem;
      }
      button,
      a {
        display: inline-flex;
        align-items: center;
        height: 2.75rem;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 999px;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      button {
        background: #18204a;
        color: #fff;
      }
      a {
        background: rgb(24 32 74 / 0.06);
        color: #18204a;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>Kamu sedang offline</h1>
      <p>
        Halaman ini belum tersimpan di perangkat. Draf dan foto yang sudah tersimpan tetap aman;
        buka lagi begitu tersambung.
      </p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Coba lagi</button>
        <a href="/">Beranda</a>
      </div>
    </main>
  </body>
</html>
