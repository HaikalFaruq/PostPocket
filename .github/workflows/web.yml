name: Web

# Lint, typecheck, unit test, build, dan E2E untuk apps/web dan packages/presets.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: web
    # Dikunci ke 24.04: di ubuntu-26.04 (ubuntu-latest yang baru) tiga tes draf dan kantong di
    # WebKit selalu habis waktu, padahal lolos di 24.04 dan di WebKit macOS (PR #85).
    runs-on: ubuntu-24.04
    # E2E saja sekitar 15 menit, dan pemasangan browser Playwright kadang tersendat beberapa
    # menit. Dengan batas 20 menit, job yang sehat pernah terhenti di tengah E2E.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Uji cek rahasia
        run: scripts/test-check-secrets.sh

      # Hook pre-commit hanya jalan di mesin yang memasangnya; di sini semua berkas teks yang
      # di-track dicek ulang, termasuk dari commit yang dibuat tanpa hook.
      - name: Tidak ada rahasia di repo
        run: git ls-files -z | xargs -0 grep -Il --null '' | xargs -0 scripts/check-secrets.sh --files

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit test
        run: pnpm test

      - name: Pasang browser Playwright
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E (build production, Android, iPhone, desktop)
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  # Sinkron Pocket (fase 2) ke stack Supabase lokal: login, tabel fase 2 dengan RLS, dan bucket
  # moments sungguhan. Lihat docs/frontend.md bagian Sinkron Pocket.
  sinkron:
    name: sinkron
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      # Dengan edge-runtime, supaya tes hapus akun memanggil fungsi `account` sungguhan.
      - name: Jalankan stack Supabase lokal
        run: supabase start -x studio,imgproxy,mailpit,realtime,logflare,vector,supavisor,postgres-meta

      - name: Pasang browser Playwright
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium webkit

      # SECRET_KEY di sini key bawaan stack lokal, bukan secret proyek.
      - name: E2E sinkron Pocket (Android, iPhone)
        working-directory: apps/web
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=')"
          export API_URL PUBLISHABLE_KEY SECRET_KEY
          SYNC_E2E=1 pnpm exec playwright test --project=android --project=iphone

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-sinkron
          path: apps/web/test-results
          retention-days: 7
